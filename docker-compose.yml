services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: project_mgmt
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://user:password@db:3306/project_mgmt
      SECRET_KEY: change-me
      UPLOAD_DIR: /app/uploads
      PADDLEOCR_URL: http://paddleocr:8000/api/v1/ocr
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      paddleocr:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  paddleocr:
    build:
      context: ./paddleocr
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./uploads:/app/uploads
      - paddleocr_cache:/root/.paddleocr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  paddleocr_cache:
